<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: https: ws://localhost:* ws://127.0.0.1:*; img-src 'self' data: https: blob:; media-src 'self' https: blob:; frame-src 'self' https:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Tiny but cute web client.">
  <title>nokakoi</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="icon/nokakoi.png">
  <link rel="shortcut icon" type="image/png" href="icon/nokakoi.png">
  <link rel="apple-touch-icon" href="icon/nokakoi.png">
  <!-- PWA: Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffeaf5">
  <script src="./js/boot/theme-color.js" type="module" data-cfasync="false"></script>
  <!-- iOS Safari: standalone display -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <script src="./js/boot/viewport.js" type="module" data-cfasync="false"></script>
  <header class="topbar">
    <div class="brand">
      <img src="icon/nokakoi.png" data-i18n-alt="brand" class="brand-icon">
      <span class="brand-text" data-i18n="brand">nokakoi</span>
    </div>
    <nav class="actions">
      <button id="openLoginModalBtn" class="secondary" type="button" data-i18n="login.button">ログイン</button>
      <button id="nsecLoginBtn" class="secondary" type="button" hidden data-i18n="login.nsec">nsec</button>
      <button id="nip46LoginBtn" class="secondary" type="button" hidden data-i18n="login.nip46">NIP-46</button>
      <button id="loginBtn" class="secondary" type="button" hidden data-i18n="login.nip07">NIP-07</button>
      <span id="userInfo" class="muted" role="button" tabindex="0" data-i18n-title="account.modal.title" title="アカウント管理"></span>
    </nav>
  </header>

  <main class="container">
    <section class="panel">
      <details id="relayPanel">
        <summary data-i18n="relays.title">リレー設定</summary>
        <p class="muted" data-i18n="relays.summary">リレーごとにread（読み込み）/write（書き込み）を設定できます。</p>
        <div class="editor-tabs mb-12">
          <button type="button" class="editor-tab active" id="tabRelayCurrent" data-i18n="editor.snapshot.tab_current">編集</button>
          <button type="button" class="editor-tab" id="tabRelaySaved" data-i18n="editor.snapshot.tab_saved">バックアップ一覧</button>
        </div>
        <div id="relayCurrentSection">
          <div class="row align-center space-between mb-12">
            <span id="relayCountBadge" class="muted text-sm"></span>
            <button id="saveRelaySnapshotBtn" class="secondary text-sm" type="button" data-i18n="editor.snapshot.save_btn">現在の状態をバックアップ</button>
          </div>
          <div id="relayList"></div>
          <div class="row flex-wrap gap-8">
            <button id="addRelay" class="secondary" type="button" data-i18n="relays.add">リレーを追加</button>
            <button id="importRelayKind10002" class="secondary" type="button" data-i18n="relays.importKind10002">kind:10002から読み込む</button>
            <button id="publishKind10002Btn" type="button" data-i18n="relay.publish_kind10002">kind:10002を上書き発行</button>
            <button id="saveRelays" type="button" data-i18n="relays.saveAndReconnect">ローカルに保存して再接続</button>
            <button id="resetRelays" class="secondary" type="button" data-i18n="relays.reset">初期値に戻す</button>
          </div>
        </div>
        <div id="relaySavedSection" hidden>
          <div id="relaySnapshotsContainer" class="relay-snapshots-container"></div>
        </div>
        <div class="row">
          <button id="openGlobalRelayModalBtn" class="secondary" type="button" data-i18n="globalRelay.title">グローバルリレー設定</button>
        </div>
        <div id="relayStatus" class="muted"></div>
      </details>
    </section>

    <section class="panel">
      <details id="displayPanel">
        <summary data-i18n="display.title">表示設定</summary>
        <div class="mt-12">
          <label class="setting-row">
            <span data-i18n="theme.label">テーマ</span>
            <select id="themeSelect">
              <option value="system" data-i18n="theme.system">自動（システム）</option>
              <option value="dark" data-i18n="theme.dark">ダーク</option>
              <option value="light" data-i18n="theme.light">ライト</option>
            </select>
          </label>
        </div>
        <div class="mt-12">
          <label class="setting-row">
            <span data-i18n="colorTheme.label">カラーテーマ</span>
            <select id="colorThemeSelect">
              <option value="pink" data-i18n="colorTheme.pink">ピンク</option>
              <option value="blue" data-i18n="colorTheme.blue">ブルー</option>
              <option value="purple" data-i18n="colorTheme.purple">パープル</option>
              <option value="green" data-i18n="colorTheme.green">グリーン</option>
              <option value="orange" data-i18n="colorTheme.orange">オレンジ</option>
              <option value="gray" data-i18n="colorTheme.gray">モノクロ</option>
            </select>
          </label>
        </div>
        <div class="mt-12">
          <label class="setting-row">
            <span data-i18n="bgBrightness.label">背景の明るさ</span>
            <div class="flex-align-center gap-8">
              <input type="range" id="bgBrightnessInput" min="50" max="150" value="100" step="5" class="settings-range-input">
              <span id="bgBrightnessValue" class="muted settings-brightness-value">100%</span>
            </div>
          </label>
        </div>
        <div class="mt-12">
          <label class="setting-row">
            <span>言語 / Language</span>
            <select id="langSelect">
              <option value="ja">日本語</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>

        <!-- タブ設定コンテナ -->
        <fieldset class="settings-fieldset">
          <legend data-i18n="tabs.settings">タブ設定</legend>
          <div id="tabSettingsList" class="flex-col"></div>
        </fieldset>
        <div class="settings-row--wrap mt-8">
          <button id="openOmochatSettingsModalBtn" class="secondary" type="button" data-i18n="omochat.settings.title">omochat設定</button>
          <button id="openReactionSettingsModalBtn" class="secondary" type="button" data-i18n="reaction.default.title">リアクション設定</button>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <span data-i18n="previewMaxLength">省略文字数</span>
            <input type="number" id="previewMaxLengthInput" min="10" max="100000" step="10" class="settings-input-narrow">
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <span data-i18n="maxEvents">最大保持件数</span>
            <input type="number" id="maxEventsInput" min="50" max="5000" step="50" class="settings-input-narrow">
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="alwaysUseNip22CommentCheck">
            <span data-i18n="alwaysUseNip22Comment">すべての返信を NIP-22 (kind:1111) で送信する (実験中)</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="useDomPurgeCheck">
            <span data-i18n="useDomPurge">DOMパージを有効にする（メモリ節約）</span>
          </label>
        </div>
        <div class="mt-12">
          <label class="setting-row-clickable">
            <input type="checkbox" id="simpleDisplayModeCheck">
            <span data-i18n="simpleDisplayMode">コンパクト表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showAvatarsCheck" checked>
            <span data-i18n="showAvatars">プロフィール画像を表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showTimelineMediaCheck">
            <span data-i18n="showTimelineMedia">画像・動画をインライン表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showCustomEmojiCheck" checked>
            <span data-i18n="showCustomEmoji">カスタム絵文字を表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showMusicStatusCheck" checked>
            <span data-i18n="showMusicStatus">Now Playingを表示</span>
          </label>
        </div>


        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showHomeOmochatCheck">
            <span data-i18n="showHomeOmochat">ホームにomochatを表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showHomeReactionsCheck">
            <span data-i18n="showHomeReactions">ホームにリアクションを表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showHomeChannelCheck">
            <span data-i18n="showHomeChannel">ホームにチャンネル投稿を表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showHomeRepost16Check">
            <span data-i18n="showHomeRepost16">ホームに汎用リポストを表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showProfileReactionsCheck">
            <span data-i18n="showProfileReactions">プロフィールにリアクションを表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showProfileChannelCheck">
            <span data-i18n="showProfileChannel">プロフィールにチャンネル投稿を表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showProfileRepost16Check">
            <span data-i18n="showProfileRepost16">プロフィールに汎用リポストを表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showProfileBannerCheck">
            <span data-i18n="showProfileBanner">プロフィールにバナーを表示</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="disableBlinkCheck">
            <span data-i18n="disableBlink">点滅通知を使用しない</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="mentionBackgroundNotificationCheck">
            <span data-i18n="mentionBackgroundNotification">ブラウザ通知（PC向け）</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="fetchFollowEmojiCheck">
            <span data-i18n="fetchFollowEmoji">フォロイーのkind:10030参照絵文字も取得する</span>
          </label>
        </div>
        <div class="mt-8">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showReceivedDeltaCheck" checked>
            <span data-i18n="showReceivedDelta">live受信時の端末時計との差分を表示</span>
          </label>
        </div>
        <div class="mt-12">
          <label class="setting-row-clickable">
            <input type="checkbox" id="showClientNameCheck" checked>
            <span data-i18n="showClientName">クライアント名を表示</span>
          </label>
        </div>
        <div class="mt-12">
          <label class="setting-row-clickable">
            <input type="checkbox" id="attachClientNameCheck" checked>
            <span data-i18n="attachClientName">投稿にクライアント名を付ける</span>
          </label>
        </div>
        <div class="mt-12">
          <div class="mt-8 setting-row">
            <label for="clientNameInput" class="text-sm" data-i18n="clientNameLabel">クライアント名</label>
            <input type="text" id="clientNameInput" value="nokakoi" maxlength="32">
          </div>
        </div>
        <div class="mt-12">
          <label for="postLinkTitleInput" class="text-sm mr-8" data-i18n="postLinkTitleLabel">投稿連携アプリ名</label>
          <input type="text" id="postLinkTitleInput" maxlength="32">
        </div>
        <div class="mt-12">
          <label for="postLinkUrlInput" class="text-sm mr-8" data-i18n="postLinkUrlLabel">投稿連携URL</label>
          <input type="text" id="postLinkUrlInput" maxlength="128">
          <span id="postLinkSaveStatus" class="muted"></span>
        </div>
        <div class="mt-8 setting-row settings-indent">
          <label class="setting-row-clickable">
            <input type="checkbox" id="postLinkOpenNewTabCheck">
            <span data-i18n="postlink.open_in_new_tab">新しいタブで開く</span>
          </label>
        </div>
        <div class="mt-8 settings-indent">
          <button id="clearEhagakiWhitelistBtn" class="secondary" type="button" data-i18n="ehagaki.clear_whitelist">投稿連携の署名要求許可をすべて取り消す</button>
          <span id="clearEhagakiWhitelistStatus" class="muted settings-status-inline"></span>
        </div>
        <div class="mt-12">
          <label for="eventLinkTitleInput" class="text-sm mr-8" data-i18n="eventLinkTitleLabel">イベント表示連携アプリ名</label>
          <input type="text" id="eventLinkTitleInput" maxlength="32">
        </div>
        <div class="mt-12">
          <label for="eventLinkUrlInput" class="text-sm mr-8" data-i18n="eventLinkUrlLabel">イベント表示連携URL</label>
          <input type="text" id="eventLinkUrlInput" maxlength="128">
          <span id="eventLinkSaveStatus" class="muted"></span>
        </div>
        <div class="mt-16">
          <button id="openFollowEditModalBtn" type="button" data-i18n="editor.follow.title">フォローリストを編集</button>
        </div>
        <div class="mt-16">
          <div class="flex-row gap-8 align-center wrap mb-4">
            <button id="fetchMuteListBtn" type="button" data-i18n="fetchMuteList">ミュートリストを取得</button>
            <button id="openMuteEditModalBtn" type="button" data-i18n="editor.mute.title">ミュートリストを編集</button>
            <span id="fetchMuteListStatus" class="muted settings-status-inline"></span>
          </div>
          <div id="muteCounts" class="muted text-sm mt-4" hidden>
            <div><span data-i18n="mute.public_label">公開ミュート：</span> <span id="mutePubPublicCount">0</span> users / <span id="muteWordPublicCount">0</span> words</div>
            <div><span data-i18n="mute.private_label">非公開ミュート：</span> <span id="mutePubPrivateCount">0</span> users / <span id="muteWordPrivateCount">0</span> words</div>
          </div>
        </div>
        <div class="mt-24">
          <button id="clearCacheBtn" class="secondary" type="button" data-i18n="clearCache">キャッシュをクリア</button>
          <span id="clearCacheStatus" class="muted settings-status-inline"></span>
        </div>
      </details>
    </section>

    <section id="composer" class="panel composer-floating" hidden>
      <div id="replyContext" class="reply-context" hidden>
        <button id="cancelReply" class="btn-cancel-reply" type="button" data-i18n-title="reply.cancelTitle" data-i18n-aria-label="reply.cancelTitle">✕</button>
        <span class="reply-context-label" data-i18n="composer.replyLabel">返信先:</span>
        <span id="replyContextContent" class="reply-context-content"></span>
        <span id="changeGeohashLabel" class="change-geohash-label" data-i18n="composer.change_geohash_label">別のgeohashに投稿</span>
      </div>
      <div class="composer-header-row">
        <h2 id="composerTitle" data-i18n="composer.title">投稿</h2>
        <span id="composerAccountInfo" class="composer-account-info" role="button" tabindex="0" data-i18n-title="account.modal.title" title="アカウント管理"></span>
      </div>
      <textarea id="noteInput" name="noteInput" rows="4" data-i18n="composer.placeholder" data-i18n-aria-label="composer.placeholder" aria-label="投稿内容" placeholder="どんな感じ？"></textarea>
      <div class="row composer-row">
        <button id="publishBtn" type="button" data-i18n="publish">投稿する</button>
        <span id="publishResult" class="muted"></span>
        <button id="steganographyBtn" class="secondary composer-spacer-btn" type="button" data-i18n-title="steganography.title">🥟</button>
        <button id="ehagakiBtn" class="secondary" type="button" data-i18n="ehagaki">eHagakiで投稿</button>
      </div>
    </section>

  <!-- @include partials/modals-main.html -->

    <section class="tabs">
      <div class="tabs-scroller">
        <!-- タブは動的に生成 -->
      </div>
    </section>

    <section id="feeds">
      <div id="feed-home" class="feed active"></div>
      <div id="feed-global" class="feed"></div>
      <div id="feed-mentions" class="feed"></div>
      <div id="feed-me" class="feed"></div>
      <div id="feed-bitchat" class="feed"></div>
      <div id="feed-channels" class="feed"></div>
    </section>
  </main>

  <!-- @include partials/modals-app.html -->

  <footer class="footer">© 2025<span id="copyrightYear"></span> betoneto <span id="buildInfo" class="muted"></span></footer>

  <!-- ページ先頭へ戻るボタン -->
  <button id="scrollToTopBtn" class="scroll-to-top" data-i18n-title="scroll.top.title" hidden>
    <img src="icon/up.png" class="icon-btn" data-i18n-alt="scroll.top.title">
  </button>

  <!-- @include partials/modals-support.html -->

  <!-- フッター情報更新とエラー表示のフォールバック -->
  <script src="./js/boot/page-status.js" type="module" data-cfasync="false"></script>

  <!-- デバッグログ出力ポリシー（全モジュール共通） -->
  <script src="./js/boot/debug-policy.js" type="module" data-cfasync="false"></script>

  <!-- Service Worker 登録 -->
  <script src="./js/boot/service-worker.js" type="module" data-cfasync="false"></script>

  <script src="./js/main.js" type="module" defer crossorigin="anonymous" data-cfasync="false"></script>

</body>
</html>
